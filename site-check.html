<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Web3 · 檔案發布檢查</title><style>body{font:16px/1.7 system-ui;max-width:850px;padding:24px;margin:auto;background:#f7f6f2;color:#273345}button,a{padding:10px;border:1px solid #ccc;border-radius:8px;background:white;color:#51449e}li{margin:10px 0;overflow-wrap:anywhere}.ok{color:#24653c}.bad{color:#9b352b}</style><h1>網站檔案發布檢查</h1><p>此頁檢查同網站檔案是否能讀取，不代表市場資料、AI 服務或所有互動已驗收。結果不會傳送到第三方。</p><p><a href="./">GTA 首頁</a> <a href="./play.html">任務大廳</a> <a href="./research-dashboard.html">原研究首頁</a></p><button id="check">檢查發布檔案 / Check files</button><p id="summary" role="status"></p><ul id="results"></ul><script>
const files=['index.html','play.html','assets/fieldwork-core.js','assets/fieldwork.js','assets/fieldwork.css','assets/trade-engine.js','assets/product-lab.js','assets/product-lab.css','assets/research-bridge.js','research-dashboard.html','p01/index.html','p02/index.html','intelligence/index.html','p03/index.html','daily/index.html','overview/index.html','learn/index.html','learn/lab.js','learn/adventure.js','learn/adventure.css','live_market_data.json','research/case-study.json'];
document.querySelector('#check').onclick=async()=>{const button=document.querySelector('#check'),list=document.querySelector('#results');button.disabled=true;list.textContent='';let failed=0;await Promise.all(files.map(async path=>{let ok=false,label='';try{const r=await fetch('./'+path,{cache:'no-store'});ok=r.ok;label=String(r.status);}catch{label='讀取失敗 / failed';}if(!ok)failed++;const li=document.createElement('li');li.textContent=(ok?'✓ ':'✕ ')+path+' — '+label;li.className=ok?'ok':'bad';list.appendChild(li);}));document.querySelector('#summary').textContent=failed?failed+' 個檔案無法讀取。請依原路徑補上，並等待 Pages 部署成功。':files.length+' 個必要檔案均可讀取。請繼續實際操作驗收。';button.disabled=false;};
</script></html>
