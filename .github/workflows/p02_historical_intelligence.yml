name: P02 Historical Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "35 1 * * *"
  push:
    paths:
      - "p02/historical_snapshot.py"
      - "p02/historical_intelligence.py"
      - "tests/p02/test_historical_intelligence.py"
      - ".github/workflows/p02_historical_intelligence.yml"

permissions:
  contents: write

jobs:
  p02-historical-intelligence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest
      - name: Run P02-009 tests
        run: pytest -q tests/p02/test_historical_intelligence.py
      - name: Verify current P02 production inputs
        run: |
          test -f data/p02/polymarket_markets.json
          test -f data/p02/kalshi_markets.json
          test -f data/p02/canonical_events.json
          test -f data/p02/discrepancies.json
          test -f data/p02/p01_context.json
          test -f data/p02/dashboard_payload.json
          echo "PASS P02-009 upstream inputs"
      - name: Capture historical snapshot
        run: python p02/historical_snapshot.py
      - name: Build historical intelligence
        run: python p02/historical_intelligence.py
      - name: Validate historical output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/p02/historical_intelligence.json")
          d=json.loads(p.read_text())
          assert d["product"]=="P02"
          assert d["milestone"]=="P02-009"
          assert d["execution_allowed"] is False
          assert d["snapshot_count"] >= 1
          print("P02-009 HISTORICAL INTELLIGENCE: PASS")
          print("Snapshot Count:", d["snapshot_count"])
          print("History State:", d["history_state"])
          PY
      - name: Commit P02 historical intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f data/p02/history data/p02/historical_intelligence.json
          if git diff --cached --quiet; then
            echo "No historical changes to commit."
            exit 0
          fi
          git commit -m "Update P02 historical intelligence"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
