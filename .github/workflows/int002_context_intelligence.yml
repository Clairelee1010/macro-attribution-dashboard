name: INT-002 Context Alignment & Divergence

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "integration/**"
      - "tests/integration/**"
      - "config/integration_context_rules.json"
      - "data/integration/intelligence_overview.json"
      - ".github/workflows/int002_context_intelligence.yml"

permissions:
  contents: write

concurrency:
  group: int002-context-intelligence
  cancel-in-progress: false

jobs:
  context-intelligence:
    name: context-intelligence
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}
      PYTHONUNBUFFERED: "1"

    steps:
      # ------------------------------------------------------------
      # 1. Checkout repository
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ------------------------------------------------------------
      # 2. Setup Python
      # ------------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ------------------------------------------------------------
      # 3. Install test dependencies
      # ------------------------------------------------------------
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest

      # ------------------------------------------------------------
      # 4. Test INT-002
      # IMPORTANT:
      # Use python -m pytest + PYTHONPATH repo root so that
      # integration.* modules can be imported reliably.
      # ------------------------------------------------------------
      - name: Test INT-002
        run: |
          echo "=========================================="
          echo "INT-002 TEST"
          echo "=========================================="
          echo "Repository root: $GITHUB_WORKSPACE"
          echo "PYTHONPATH: $PYTHONPATH"

          python -m pytest -q tests/integration/test_int002.py

      # ------------------------------------------------------------
      # 5. Build / refresh INT-001 integration input
      # INT-002 consumes the normalized P01 x P02 overview produced
      # by INT-001.
      # ------------------------------------------------------------
      - name: Build INT-001 input
        run: |
          echo "=========================================="
          echo "BUILD INT-001 INPUT"
          echo "=========================================="

          python integration/integration_engine.py

          test -f data/integration/intelligence_overview.json

          echo "INT-001 input: PASS"

      # ------------------------------------------------------------
      # 6. Build INT-002 context intelligence
      # ------------------------------------------------------------
      - name: Build INT-002 context intelligence
        run: |
          echo "=========================================="
          echo "BUILD INT-002 CONTEXT INTELLIGENCE"
          echo "=========================================="

          python integration/context_intelligence_engine.py

          test -f data/integration/context_intelligence.json

          echo "INT-002 build: PASS"

      # ------------------------------------------------------------
      # 7. Validate INT-002 output
      # ------------------------------------------------------------
      - name: Validate INT-002 output
        run: |
          echo "=========================================="
          echo "VALIDATE INT-002 OUTPUT"
          echo "=========================================="

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/integration/context_intelligence.json")

          if not path.exists():
              raise SystemExit(
                  "INT-002 validation failed: "
                  "context_intelligence.json not found"
              )

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if not isinstance(data, dict):
              raise SystemExit(
                  "INT-002 validation failed: root must be an object"
              )

          # --------------------------------------------------------
          # Safety / execution guardrail
          # --------------------------------------------------------
          execution_allowed = data.get("execution_allowed")

          if execution_allowed is not False:
              raise SystemExit(
                  "INT-002 validation failed: "
                  "execution_allowed must be false"
              )

          # --------------------------------------------------------
          # Locate prediction/context records.
          # Keep validation tolerant to metadata wrappers while
          # ensuring the generated intelligence is present.
          # --------------------------------------------------------
          records = None

          candidate_keys = (
              "predictions",
              "context_intelligence",
              "contexts",
              "items",
              "results",
          )

          for key in candidate_keys:
              value = data.get(key)
              if isinstance(value, list):
                  records = value
                  break

          if records is None:
              # Some implementations may store the records under
              # an intelligence object.
              intelligence = data.get("intelligence")

              if isinstance(intelligence, dict):
                  for key in candidate_keys:
                      value = intelligence.get(key)
                      if isinstance(value, list):
                          records = value
                          break

          if records is None:
              raise SystemExit(
                  "INT-002 validation failed: "
                  "no context intelligence record list found"
              )

          allowed_relationships = {
              "SUPPORTED_CONTEXT",
              "MIXED_CONTEXT",
              "DIVERGENT_CONTEXT",
              "INSUFFICIENT_EVIDENCE",
              "NOT_APPLICABLE",
          }

          invalid_relationships = []

          for index, record in enumerate(records, start=1):
              if not isinstance(record, dict):
                  raise SystemExit(
                      f"INT-002 validation failed: "
                      f"record #{index} is not an object"
                  )

              relationship = (
                  record.get("relationship")
                  or record.get("relationship_state")
                  or record.get("context_relationship")
              )

              if relationship is None:
                  continue

              if relationship not in allowed_relationships:
                  invalid_relationships.append(
                      (index, relationship)
                  )

          if invalid_relationships:
              raise SystemExit(
                  "INT-002 validation failed: "
                  f"invalid relationship states: "
                  f"{invalid_relationships}"
              )

          print(
              "INT-002 CONTEXT ALIGNMENT & DIVERGENCE: PASS"
          )
          print(
              "Context records:",
              len(records),
          )
          print(
              "Execution:",
              "DISABLED",
          )
          PY

      # ------------------------------------------------------------
      # 8. Commit generated INT-001 / INT-002 intelligence
      # ------------------------------------------------------------
      - name: Commit INT-002 intelligence
        run: |
          echo "=========================================="
          echo "COMMIT INT-002 INTELLIGENCE"
          echo "=========================================="

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            data/integration/intelligence_overview.json \
            data/integration/context_intelligence.json

          if git diff --cached --quiet; then
            echo "No INT-002 intelligence changes to commit."
            exit 0
          fi

          git commit -m "Update INT-002 context intelligence"

          # Protect against non-fast-forward when another workflow
          # updated main during this run.
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

          echo "INT-002 intelligence committed successfully."

      # ------------------------------------------------------------
      # 9. Final acceptance summary
      # ------------------------------------------------------------
      - name: INT-002 acceptance summary
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "INT-002 CONTEXT ALIGNMENT & DIVERGENCE"
          echo "=========================================="
          echo "P01 Context Loaded          PASS"
          echo "P02 Predictions Loaded      PASS"
          echo "Context Mapping             PASS"
          echo "Evidence Guardrail          PASS"
          echo "Political Guardrail         PASS"
          echo "Explanation Generation      PASS"
          echo "Execution                   DISABLED"
          echo "------------------------------------------"
          echo "INT-002: PASS"
          echo "=========================================="
