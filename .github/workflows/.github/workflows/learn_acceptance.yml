name: Web3 Learning Lab acceptance
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'learn/**'
      - 'tests/learn/**'
      - '.github/workflows/learn_acceptance.yml'
permissions:
  contents: read
jobs:
  learn:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/learn/lab.test.cjs
      - run: npx playwright install --with-deps chromium
      - run: node tests/learn/browser-acceptance.mjs
