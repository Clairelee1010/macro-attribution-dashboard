name: P02 Production Acceptance

on:
  workflow_dispatch:
  push:
    paths:
      - "p02/production_acceptance.py"
      - "tests/p02/test_production_acceptance.py"
      - ".github/workflows/p02_production_acceptance.yml"

permissions:
  contents: read

jobs:
  p02-production-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Verify P02 production artifacts
        run: |
          test -f data/p02/polymarket_markets.json
          test -f data/p02/kalshi_markets.json
          test -f data/p02/canonical_events.json
          test -f data/p02/discrepancies.json
          test -f data/p02/p01_context.json
          test -f data/p02/dashboard_payload.json
          test -f data/p02/historical_intelligence.json
          echo "PASS P02 production artifacts"

      - name: Run P02-010 tests
        run: pytest -q tests/p02/test_production_acceptance.py

      - name: Run P02-010 production acceptance
        run: python p02/production_acceptance.py
