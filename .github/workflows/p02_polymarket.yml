name: P02 Polymarket Data Update

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    paths:
      - "p02/adapters/polymarket_adapter.py"
      - "p02/schemas/prediction_market.schema.json"
      - "tests/p02/test_polymarket_adapter.py"
      - ".github/workflows/p02_polymarket.yml"

permissions:
  contents: write

concurrency:
  group: p02-polymarket-data
  cancel-in-progress: false

jobs:
  update-polymarket:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests jsonschema pytest

      - name: Run adapter unit tests
        run: pytest -q tests/p02/test_polymarket_adapter.py

      - name: Fetch and normalize live Polymarket data
        run: python p02/adapters/polymarket_adapter.py --limit 20

      - name: Validate generated market records
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator, FormatChecker

          schema = json.loads(Path("p02/schemas/prediction_market.schema.json").read_text())
          doc = json.loads(Path("data/p02/polymarket_markets.json").read_text())
          assert doc["execution_allowed"] is False
          assert doc["market_count"] > 0
          validator = Draft202012Validator(schema, format_checker=FormatChecker())
          errors = []
          for i, market in enumerate(doc["markets"]):
              for e in validator.iter_errors(market):
                  errors.append(f"{i}: {e.message}")
          assert not errors, errors[:20]
          print(f"PASS: {doc['market_count']} live normalized markets")
          PY

      - name: Commit generated P02 data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # HOTFIX: stage first so a brand-new untracked JSON file is detected.
          git add -f data/p02/polymarket_markets.json

          if git diff --cached --quiet; then
            echo "No generated Polymarket data changes to commit."
            exit 0
          fi

          git commit -m "Update P02 Polymarket market data"

          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Polymarket JSON committed to main."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying..."
            sleep $((attempt * 3))
          done
          exit 1
