name: P03 Tokenized Equity Intelligence

on:
  workflow_dispatch:
  schedule:
    - cron: "25 * * * *"

permissions:
  contents: write

concurrency:
  group: p03-tokenized-equity-main
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Collect read-only traditional and tokenized equity evidence
        env:
          APCA_API_KEY_ID: ${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY: ${{ secrets.APCA_API_SECRET_KEY }}
        run: python p03_tokenized_equity.py
      - name: Validate P03-002A guardrails and schema
        run: |
          python - <<'PY2'
          import json
          from pathlib import Path
          p=json.loads(Path('p03/data/tokenized_equity_intelligence.json').read_text())
          assert p['execution']=='DISABLED'
          assert 'NO_ORDER' in p['guardrails'] and 'NO_WALLET' in p['guardrails']
          assert 'DISCREPANCY_NOT_ARBITRAGE' in p['guardrails']
          assert {(x['underlying'],x['token']) for x in p['pairs']}=={('AAPL','AAPLx'),('NVDA','NVDAx')}
          assert all(x['mapping']['status']=='VERIFIED_PRODUCT_MAPPING' for x in p['pairs'])
          print('P03-002A guardrails PASS')
          PY2
      - name: Commit generated P03-002A data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p03/data/tokenized_equity_intelligence.json
          git diff --cached --quiet && exit 0
          git commit -m "P03-002A: update tokenized equity intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
