name: Daily Data Update

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - 'data.json'
      - 'live_market_data.json'
      - 'pipeline_status.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yfinance
          fi

      - name: Run dashboard data pipeline
        run: python update_data.py

      - name: Run live market data pipeline
        run: python update_market_data.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data.json",
              "live_market_data.json",
              "pipeline_status.json",
          ]

          for filename in required:
              path = Path(filename)
              if not path.exists():
                  raise FileNotFoundError(f"Missing generated file: {filename}")

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"PASS: {filename}")

          print("PASS: All generated JSON files are valid.")
          PY

      - name: Auto Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update dashboard and live market data [skip ci]"
          file_pattern: |
            data.json
            live_market_data.json
            pipeline_status.json
          git_user_name: "github-actions[bot]"
          git_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
