name: Daily Data Update

on:
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = Taiwan 09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - 'live_market_data.json'
      - 'raw_market_data.json'
      - 'normalized_market_data.json'
      - 'data_quality_report.json'
      - 'signal_report.json'
      - 'regime_report.json'
      - 'attribution_report.json'
      - 'market_risk_report.json'
      - 'confidence_evidence_report.json'
      - 'dashboard_data.json'
      - 'pipeline_status.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run dashboard data pipeline
        run: python update_data.py
      - name: Run intelligence pipeline through P01-009
        run: python update_market_data.py
      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          required=["data.json","live_market_data.json","raw_market_data.json","normalized_market_data.json","data_quality_report.json","signal_report.json","regime_report.json","attribution_report.json","market_risk_report.json","confidence_evidence_report.json","dashboard_data.json","pipeline_status.json"]
          for filename in required:
              p=Path(filename)
              if not p.exists(): raise FileNotFoundError(filename)
              json.loads(p.read_text(encoding="utf-8"))
              print(f"PASS: {filename}")
          print("PASS: P01-010 production artifacts are valid JSON")
          PY
      - name: Stage generated artifacts
        run: |
          git add -- data.json live_market_data.json raw_market_data.json normalized_market_data.json data_quality_report.json signal_report.json regime_report.json attribution_report.json market_risk_report.json confidence_evidence_report.json dashboard_data.json pipeline_status.json
          git status --short
      - name: Commit and push generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            exit 0
          fi
          git commit -m "🤖 Auto-update dashboard and intelligence data [skip ci]"
          git push origin HEAD:main
