name: Daily Data Update

on:
  schedule:
    - cron: '0 1 * * *'

  workflow_dispatch:

  push:
    branches:
      - main
    paths-ignore:
      - 'data.json'
      - 'live_market_data.json'
      - 'pipeline_status.json'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install yfinance
          fi

      # Existing dashboard pipeline
      - name: Run existing dashboard data pipeline
        run: python update_data.py

      # P01-000 automated live market pipeline
      - name: Run live market data pipeline
        run: python update_market_data.py

      # Basic output validation
      - name: Validate generated files
        run: |
          test -f data.json
          test -f live_market_data.json
          test -f pipeline_status.json

          echo "PASS: data.json generated"
          echo "PASS: live_market_data.json generated"
          echo "PASS: pipeline_status.json generated"

      - name: Auto Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update dashboard and live market data [skip ci]"
          file_pattern: |
            data.json
            live_market_data.json
            pipeline_status.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "41898282+github-actions[bot]@users.noreply.github.com"
