name: Daily Data Update

on:
  schedule:
    - cron: '0 1 * * *' # UTC 01:00 = Taiwan 09:00
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'data.json'
      - 'live_market_data.json'
      - 'raw_market_data.json'
      - 'normalized_market_data.json'
      - 'data_quality_report.json'
      - 'signal_report.json'
      - 'regime_report.json'
      - 'attribution_report.json'
      - 'market_risk_report.json'
      - 'confidence_evidence_report.json'
      - 'dashboard_data.json'
      - 'pipeline_status.json'
      - 'market_intelligence_feed.json'

permissions:
  contents: write

# Prevent two data-update runs from writing to main at the same time.
concurrency:
  group: daily-data-update-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install requests

      - name: Run dashboard data pipeline
        run: python update_data.py

      - name: Run intelligence pipeline through P01-009
        run: python update_market_data.py

      - name: Run P01-NEWS-001 market intelligence feed
        run: python market_intelligence.py --output market_intelligence_feed.json

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "data.json",
              "live_market_data.json",
              "raw_market_data.json",
              "normalized_market_data.json",
              "data_quality_report.json",
              "signal_report.json",
              "regime_report.json",
              "attribution_report.json",
              "market_risk_report.json",
              "confidence_evidence_report.json",
              "dashboard_data.json",
              "pipeline_status.json",
              "market_intelligence_feed.json",
          ]

          for filename in required:
              p = Path(filename)
              if not p.exists():
                  raise FileNotFoundError(filename)
              json.loads(p.read_text(encoding="utf-8"))
              print(f"PASS: {filename}")

          feed = json.loads(
              Path("market_intelligence_feed.json").read_text(encoding="utf-8")
          )
          print(
              "NEWS:",
              feed.get("status"),
              "| items:",
              len(feed.get("items", [])),
              "| generated_at:",
              feed.get("generated_at"),
          )
          print("PASS: P01-010 + P01-NEWS-001 production artifacts are valid JSON")
          PY

      - name: Stage generated artifacts
        run: |
          git add --             data.json             live_market_data.json             raw_market_data.json             normalized_market_data.json             data_quality_report.json             signal_report.json             regime_report.json             attribution_report.json             market_risk_report.json             confidence_evidence_report.json             dashboard_data.json             pipeline_status.json             market_intelligence_feed.json
          git status --short

      - name: Commit generated artifacts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "No generated data changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "🤖 Auto-update dashboard, intelligence and news data [skip ci]"
          echo "has_changes=true" >> "$GITHUB_OUTPUT"

      - name: Sync with latest main and push
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "Push attempt $attempt/3"

            git fetch origin main
            git rebase origin/main

            if git push origin HEAD:main; then
              echo "Push succeeded."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Remote main changed again. Retrying..."
              sleep 5
            fi
          done

          echo "Push failed after 3 attempts."
          exit 1
