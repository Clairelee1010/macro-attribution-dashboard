name: P01-002 Raw Data Schema Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p01-002-raw-data-schema
    paths:
      - "adapters/**"
      - "tests/**"
      - "update_market_data.py"
      - "requirements.txt"
      - "schemas/**"
      - "schema_validation.py"
      - ".github/workflows/test_market_pipeline.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify repository structure
        run: |
          echo "Workspace: $GITHUB_WORKSPACE"
          echo "Repository files:"
          find . -maxdepth 3 -type f | sort

          test -f update_market_data.py
          test -f adapters/__init__.py
          test -f adapters/base_adapter.py
          test -f adapters/fred_adapter.py
          test -f adapters/market_adapter.py
          test -f adapters/crypto_adapter.py
          test -f tests/test_adapters.py
          test -f tests/test_pipeline_integration.py
          test -f tests/test_raw_data_schema.py
          test -f schemas/raw_market_data.schema.json
          test -f schema_validation.py

          echo "PASS: P01-002 repository structure verified"

      - name: Verify Python imports
        run: |
          python - <<'PY'
          import sys
          print("Python path:")
          for path in sys.path:
              print(path)

          import adapters
          import update_market_data

          print("PASS: adapters import")
          print("PASS: update_market_data import")
          PY

      - name: Deterministic tests
        run: |
          python -m pytest tests -q

      - name: Live adapter pipeline
        run: |
          python update_market_data.py

      - name: Validate P01-002 contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from schema_validation import validate_raw_payload

          expected = {"US10Y", "DXY", "VIX", "BTC", "ETH"}
          raw = json.loads(Path("raw_market_data.json").read_text(encoding="utf-8"))
          live = json.loads(Path("live_market_data.json").read_text(encoding="utf-8"))
          status = json.loads(Path("pipeline_status.json").read_text(encoding="utf-8"))

          assert validate_raw_payload(raw) is True
          assert raw["schema_version"] == "2.0"
          assert set(raw["expected_metrics"]) == expected
          assert {r["metric_id"] for r in raw["records"]} == expected
          assert live["schema_version"] == "1.0"
          assert set(live["metrics"]) == expected
          assert status["pipeline"] == "P01-002"
          assert status["raw_schema_version"] == "2.0"
          assert status["raw_schema_valid"] is True

          print("PASS: raw schema v2.0 validated")
          print("PASS: five expected raw metric records present")
          print("PASS: provenance/status/timestamps contract enforced")
          print("PASS: live schema v1.0 backward compatibility preserved")
          print("PASS: P01-002 pipeline status generated")
          print("P01-002 ACCEPTANCE CONTRACT: PASS")
          PY
