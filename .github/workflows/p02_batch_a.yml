name: P02 Batch A Intelligence

on:
  workflow_dispatch:
  push:
    paths:
      - "p02/event_matcher.py"
      - "p02/discrepancy_engine.py"
      - "p02/p01_context.py"
      - "p02/run_batch_a.py"
      - "tests/p02/test_batch_a.py"
      - ".github/workflows/p02_batch_a.yml"

permissions:
  contents: write

jobs:
  p02-batch-a:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip jsonschema pytest
      - name: Run Batch A unit tests
        run: pytest -q tests/p02/test_batch_a.py
      - name: Verify upstream live datasets
        run: |
          test -f data/p02/polymarket_markets.json
          test -f data/p02/kalshi_markets.json
          echo "PASS upstream datasets"
      - name: Run P02-004 005 006
        run: python p02/run_batch_a.py
      - name: Commit Batch A intelligence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/p02/canonical_events.json data/p02/discrepancies.json data/p02/p01_context.json
          if git diff --cached --quiet; then
            echo "No generated Batch A changes to commit."
            exit 0
          fi
          git commit -m "Update P02 Batch A intelligence"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          exit 1
