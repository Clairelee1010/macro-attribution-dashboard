name: P01-001 Adapter Acceptance
on:
  workflow_dispatch:
  push:
    branches: [feature/p01-001-data-source-adapters]
    paths: ["adapters/**","tests/**","update_market_data.py","requirements.txt",".github/workflows/test_market_pipeline.yml"]
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Deterministic tests
        run: pytest -q
      - name: Live adapter pipeline
        run: python update_market_data.py
      - name: Validate contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open("live_market_data.json"))
          expected={"US10Y","DXY","VIX","BTC","ETH"}
          assert d["schema_version"]=="1.0"
          assert set(d["metrics"])==expected
          assert d["data_quality"]["total"]==5
          for k,v in d["metrics"].items():
              assert v["status"] in {"FRESH","STALE","MISSING","ERROR"}
              assert v["source_type"] in {"PRIMARY","FALLBACK","NONE"}
              print(k,v["status"],v["source_type"],v["source"],v["value"])
          print("P01-001 ACCEPTANCE CONTRACT: PASS")
          PY
