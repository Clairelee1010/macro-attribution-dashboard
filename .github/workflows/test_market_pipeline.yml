name: Test Live Market Pipeline

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test-market-data:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance

      - name: Run live market pipeline
        run: |
          python update_market_data.py

      - name: Show generated market data
        run: |
          echo "===== LIVE MARKET DATA ====="
          cat live_market_data.json

          echo "===== PIPELINE STATUS ====="
          cat pipeline_status.json

      - name: Commit test data
        run: |
          git config user.name "market-data-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live_market_data.json pipeline_status.json

          if git diff --cached --quiet; then
            echo "No market data changes."
          else
            git commit -m "data: update live market data [skip ci]"
            git push
          fi
