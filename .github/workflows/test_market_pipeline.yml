name: P01-003 Normalization Acceptance

on:
  workflow_dispatch:
  push:
    branches:
      - feature/p01-003-normalization
    paths:
      - "adapters/**"
      - "tests/**"
      - "update_market_data.py"
      - "normalization.py"
      - "normalization_validation.py"
      - "requirements.txt"
      - "schemas/**"
      - "schema_validation.py"
      - ".github/workflows/test_market_pipeline.yml"

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify repository structure
        run: |
          test -f normalization.py
          test -f normalization_validation.py
          test -f schemas/normalized_market_data.schema.json
          test -f tests/test_normalization.py
          echo "PASS: P01-003 repository structure verified"
      - name: Deterministic tests
        run: python -m pytest tests -q
      - name: Live pipeline
        run: python update_market_data.py
      - name: Validate P01-003 contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from schema_validation import validate_raw_payload
          from normalization_validation import validate_normalized_payload

          expected={"US10Y","DXY","VIX","BTC","ETH"}
          raw=json.loads(Path("raw_market_data.json").read_text())
          normalized=json.loads(Path("normalized_market_data.json").read_text())
          live=json.loads(Path("live_market_data.json").read_text())
          status=json.loads(Path("pipeline_status.json").read_text())
          assert validate_raw_payload(raw)
          assert validate_normalized_payload(normalized)
          assert {r["metric_id"] for r in normalized["records"]} == expected
          assert all(r["transformation"]["deterministic"] is True for r in normalized["records"])
          assert live["schema_version"] == "1.0"
          assert raw["schema_version"] == "2.0"
          assert normalized["schema_version"] == "3.0"
          assert status["pipeline"] == "P01-003"
          assert status["normalized_schema_valid"] is True
          print("PASS: five expected metrics normalized")
          print("PASS: raw schema v2.0 preserved")
          print("PASS: normalized schema v3.0 validated")
          print("PASS: deterministic transformation lineage present")
          print("PASS: live schema v1.0 backward compatibility preserved")
          print("P01-003 ACCEPTANCE CONTRACT: PASS")
          PY
