name: P01-008 Market Risk Acceptance

on:
  push:
    branches:
      - feature/p01-008-market-risk

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify P01-008 repository structure
        run: |
          test -f market_risk.py
          test -f market_risk_validation.py
          test -f config/market_risk_rules.json
          test -f schemas/market_risk_report.schema.json
          test -f tests/test_market_risk.py
          echo "PASS: P01-008 repository structure verified"

      - name: Verify Market Risk Engine imports
        run: |
          python -c "from market_risk import build_market_risk_report; from market_risk_validation import validate_market_risk_report; print('PASS: P01-008 imports')"

      - name: Run deterministic tests
        run: |
          python -m pytest tests -q

      - name: Run live market pipeline
        run: |
          python update_market_data.py

      - name: Validate P01-008 artifacts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "raw_market_data.json",
              "normalized_market_data.json",
              "data_quality_report.json",
              "signal_report.json",
              "regime_report.json",
              "attribution_report.json",
              "market_risk_report.json",
              "pipeline_status.json",
          ]

          for filename in required:
              path = Path(filename)

              if not path.exists():
                  raise FileNotFoundError(
                      f"Missing P01-008 artifact: {filename}"
                  )

              with path.open("r", encoding="utf-8") as f:
                  json.load(f)

              print(f"PASS: {filename}")

          risk = json.loads(
              Path("market_risk_report.json").read_text(
                  encoding="utf-8"
              )
          )

          assert risk["schema_version"] == "8.0"
          assert risk["engine"] == "P01-008"

          assert risk["risk_level"] in {
              "LOW",
              "MODERATE",
              "HIGH",
          }

          assert 0 <= risk["risk_score"] <= 100
          assert 0 <= risk["confidence"] <= 1
          assert 0 <= risk["evidence_coverage"] <= 1

          print(
              "PASS: Market Risk schema_version =",
              risk["schema_version"],
          )

          print(
              "PASS: Market Risk level =",
              risk["risk_level"],
          )

          print(
              "PASS: Market Risk score =",
              risk["risk_score"],
          )

          print(
              "PASS: Market Risk confidence =",
              risk["confidence"],
          )

          print(
              "P01-008 ACCEPTANCE CONTRACT: PASS"
          )
          PY
